name: Publish

# Three ways to cut a stable release:
#   1. The nightly schedule, 03:00 UTC. Skipped when main has not moved since
#      the latest stable release. This is the normal path: a build ships
#      every night without anyone dispatching it.
#   2. Actions → Publish → "Run workflow" — version optional (empty = next
#      patch above the highest existing release). Fully CI, no local git.
#   3. Push a vX.Y.Z tag (the original path) — still works identically.
# On every path electron-builder creates the GitHub Release (tag included, for
# the schedule and dispatch paths) as a FULL release, which is what the update
# feed and the website's download button follow.
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z). Leave empty for the next patch above the latest release.'
        required: false
        type: string

# The version job reads "the highest release so far" at run time, so two runs
# in flight would stamp the same version and race to create one release.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    # Only the scheduled run can be pointless. It compares main against the
    # latest stable release rather than a 24h window so a night the cron
    # misses is caught up the next night instead of waiting for a new commit.
    if: github.event_name != 'schedule' || github.repository == 'Gilbert09/talyn'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "No stable release yet, building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AHEAD=$(gh api "repos/$GITHUB_REPOSITORY/compare/$LATEST...$GITHUB_SHA" --jq .ahead_by)
          if [ "$AHEAD" -gt 0 ]; then
            echo "main is $AHEAD commit(s) ahead of $LATEST, building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing has landed since $LATEST, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  # Resolved ONCE and fanned out, so every platform bakes the identical
  # version into release/app/package.json. Three legs each computing "the
  # next patch above the latest release" would race — the first to publish
  # would move the ceiling under the others.
  version:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The tag list is read on EVERY path, not just the auto one. The
          # `previous` output — the highest release below the one we're about
          # to cut — is what the release-notes job compares against, and it has
          # to be resolved HERE: by the time that job runs, electron-builder has
          # created this release's tag, so "the latest release" is us.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' > /tmp/release-tags.txt || true
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(node -e "
              const fs = require('fs');
              const parse = (s) => {
                const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(s.trim());
                return m && [Number(m[1]), Number(m[2]), Number(m[3])];
              };
              const tags = fs.existsSync('/tmp/release-tags.txt')
                ? fs.readFileSync('/tmp/release-tags.txt', 'utf8').split('\n')
                : [];
              const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              const max = tags.map(parse).filter(Boolean).sort(cmp).pop() ?? [0, 1, 0];
              console.log([max[0], max[1], max[2] + 1].join('.'));
            ")
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be X.Y.Z, got: $VERSION" >&2
            exit 1
          fi
          # Highest existing release STRICTLY below the one being cut. Empty on
          # a first-ever release, and empty on a re-run of an existing version
          # (a tag equal to VERSION is excluded either way) — both of which the
          # release-notes job treats as "nothing to compare, skip".
          PREVIOUS=$(VERSION="$VERSION" node -e "
            const fs = require('fs');
            const parse = (s) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(s.trim());
              return m && { key: [Number(m[1]), Number(m[2]), Number(m[3])], tag: s.trim() };
            };
            const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const target = parse(process.env.VERSION).key;
            const tags = fs.existsSync('/tmp/release-tags.txt')
              ? fs.readFileSync('/tmp/release-tags.txt', 'utf8').split('\n')
              : [];
            const below = tags.map(parse).filter(Boolean).filter((t) => cmp(t.key, target) < 0);
            below.sort((a, b) => cmp(a.key, b.key));
            console.log(below.length > 0 ? below[below.length - 1].tag : '');
          ")
          echo "Releasing $VERSION (previous: ${PREVIOUS:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

  publish:
    # macOS goes FIRST and alone: it's the leg that creates the GitHub Release
    # (and, on the schedule and dispatch paths, the tag). Windows/Linux then
    # upload into the release it made — see publish-others. Running all three
    # in parallel would race three electron-builder processes to create the
    # same release.
    needs: version
    runs-on: macos-latest
    # Needed for GITHUB_TOKEN to create the GitHub Release + upload assets.
    permissions:
      contents: write

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install

      - name: Stamp the release version
        # Build-time only — not committed. electron-builder packages from
        # directories.app (release/app), so the version it bakes in (and what
        # app.getVersion() / the update feed report) comes from
        # release/app/package.json. Without this, every build would ship as
        # the stale static version (0.1.0) and updaters would never take it.
        # Resolved by the `version` job so all three platform legs agree.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd apps/desktop/release/app
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = process.env.VERSION;
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('Building release', p.version);
          "

      - name: Build workspace packages
        # @talyn/client too — the desktop renderer imports it from dist.
        run: |
          npm run build -w @talyn/shared
          npm run build -w @talyn/client

      - name: Build desktop app
        # Baked into the renderer bundle by webpack at build time — must be on
        # this step. Without them the app defaults to http://localhost:4747
        # with no auth. Supabase anon key is publishable, hence repo variables.
        env:
          TALYN_API_URL: https://prod.talyn.dev
          TALYN_SUPABASE_URL: ${{ vars.TALYN_SUPABASE_URL }}
          TALYN_SUPABASE_ANON_KEY: ${{ vars.TALYN_SUPABASE_ANON_KEY }}
          TALYN_POSTHOG_KEY: ${{ vars.TALYN_POSTHOG_KEY }}
          TALYN_POSTHOG_HOST: https://us.i.posthog.com
        run: |
          npm run build -w @talyn/desktop

      - name: Upload renderer source maps to PostHog
        # Symbolicates renderer exceptions in PostHog. `inject` stamps chunk IDs
        # into the built JS + maps so PostHog can match a minified frame back to
        # its source; `upload --delete-after` ships the maps to PostHog then
        # deletes them from disk so they aren't packed into the shipped app.
        # Runs after the build and before packaging so electron-builder bundles
        # the injected JS. No-op until POSTHOG_CLI_API_KEY is configured, and
        # never blocks a release — symbolication is auxiliary. (The skip is
        # guarded inside the script, not via `if:` — the `secrets` context is
        # not allowed in `if` conditions.)
        continue-on-error: true
        env:
          POSTHOG_CLI_HOST: https://us.posthog.com
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "POSTHOG_CLI_API_KEY not set — skipping source map upload."
            exit 0
          fi
          npx --yes @posthog/cli@latest sourcemap inject \
            --directory apps/desktop/release/app/dist/renderer
          npx --yes @posthog/cli@latest sourcemap upload \
            --directory apps/desktop/release/app/dist/renderer --delete-after

      - name: Select Xcode 26 for actool
        # The afterPack hook (.erb/scripts/mac-asset-catalog.js) compiles
        # assets/icon.icon into an Assets.car so macOS 26 renders the Liquid
        # Glass icon (default/dark/clear/tinted). That needs actool 26+; the
        # hook hard-fails in CI without it, so fail here with a clearer error
        # if the runner image carries no Xcode 26.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 on this runner image — the Liquid Glass icon needs actool 26+."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"

      - name: Publish releases
        env:
          # Code-signing + notarization. The app must be signed with a
          # Developer ID Application cert and notarized or Squirrel.Mac
          # refuses to apply the update on the client.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Releases publish to this (public) repo, so the workflow's own
          # GITHUB_TOKEN can upload the assets — no PAT needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop
          # electron is hoisted to the monorepo root node_modules, so
          # electron-builder can't infer the version from this workspace —
          # resolve it explicitly and pass it in.
          ELECTRON_VERSION=$(node -p "require('electron/package.json').version")
          npm exec electron-builder -- --publish always \
            -c.electronVersion="$ELECTRON_VERSION"

  release-notes:
    # Generates this release's "What's new" highlights from its commits and
    # posts them to the backend, which is where both front ends read them.
    #
    # `needs: publish` is the whole safety story: the macOS leg is what creates
    # the GitHub release, so waiting on it means a version that failed to build
    # is never announced to users. It deliberately does NOT wait on
    # publish-others — a Windows or Linux upload hiccup has nothing to do with
    # whether the notes are correct, and the release exists either way.
    #
    # Skipped on a first-ever release: with no previous tag there is no range
    # to summarise.
    #
    # `continue-on-error` and a script that exits 0 on every soft failure:
    # release notes are auxiliary. A GitHub blip, an Anthropic 529, or a backend
    # deploy in flight must never turn a shipped release into a red run.
    needs: [version, publish]
    if: needs.version.outputs.previous != ''
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        # The generator imports the commit filter and the version helpers from
        # @talyn/shared rather than carrying its own copy — the same code the
        # backend and both front ends use, and the code the tests pin.
        run: npm run build -w @talyn/shared

      - name: Generate and publish release notes
        # Guarded inside the script rather than with `if:` — the `secrets`
        # context is not allowed in `if` conditions, same as the PostHog
        # sourcemap step above. Missing either secret is a logged skip.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TALYN_API_URL: https://prod.talyn.dev
          TALYN_RELEASE_INGEST_SECRET: ${{ secrets.TALYN_RELEASE_INGEST_SECRET }}
        run: node scripts/release-notes/generate.mjs

  publish-others:
    # Windows (NSIS) + Linux (AppImage). Targets were already declared in
    # apps/desktop/package.json `build.win`/`build.linux` — the only thing
    # keeping Talyn macOS-only was that nothing ever ran electron-builder on
    # those runners.
    #
    # `needs: publish` is load-bearing, not just ordering: the macOS leg
    # creates the GitHub Release (and the tag, on the schedule and dispatch
    # paths), and these legs upload into it. It also means a Windows/Linux failure can
    # never take down a macOS release that already published cleanly.
    #
    # No notarization and no CSC_* here. macOS signing config lives under
    # `build.mac`, so it simply doesn't apply. Windows ships UNSIGNED until
    # an EV cert is bought — users get a SmartScreen "unknown publisher"
    # prompt on first install. Set CSC_LINK/CSC_KEY_PASSWORD to fix that;
    # electron-builder picks them up with no workflow change.
    needs: [version, publish]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One platform failing must not cancel the other — a Linux toolchain
      # hiccup shouldn't cost Windows users their build.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Stamp the release version
        # Same version the macOS leg baked — from the shared `version` job,
        # never recomputed (see that job's comment).
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd apps/desktop/release/app
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = process.env.VERSION;
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('Building release', p.version);
          "

      - name: Build workspace packages
        # @talyn/client too, not just shared — apps/desktop's renderer imports
        # it from dist, so webpack fails with "Can't resolve '@talyn/client'"
        # without this. Adding the package updated test.yml and deploy-app.yml
        # but not the release workflows, which broke the nightly.
        run: |
          npm run build -w @talyn/shared
          npm run build -w @talyn/client

      - name: Build desktop app
        env:
          TALYN_API_URL: https://prod.talyn.dev
          TALYN_SUPABASE_URL: ${{ vars.TALYN_SUPABASE_URL }}
          TALYN_SUPABASE_ANON_KEY: ${{ vars.TALYN_SUPABASE_ANON_KEY }}
          TALYN_POSTHOG_KEY: ${{ vars.TALYN_POSTHOG_KEY }}
          TALYN_POSTHOG_HOST: https://us.i.posthog.com
        run: npm run build -w @talyn/desktop

      # Deliberately no PostHog sourcemap step: the renderer bundle is
      # identical across platforms, so the macOS leg's upload already
      # symbolicates Windows/Linux renderer exceptions.

      - name: Publish platform artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `shell: bash` so the one script works on the Windows runner too
        # (its default is PowerShell, where this is a syntax error).
        shell: bash
        run: |
          cd apps/desktop
          ELECTRON_VERSION=$(node -p "require('electron/package.json').version")
          npm exec electron-builder -- --publish always \
            -c.electronVersion="$ELECTRON_VERSION"
