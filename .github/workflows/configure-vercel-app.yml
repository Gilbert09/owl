name: Configure Vercel app project

# One-off, manually triggered. Sets the app.talyn.dev Vercel project's Root
# Directory and its build-time environment variables, using the VERCEL_TOKEN
# that already exists as a repo secret — so the token stays inside Actions
# rather than being handed around.
#
# Idempotent: the env POST uses upsert=true, so re-running just overwrites.
# Delete this workflow once the project is configured; it is a setup tool,
# not part of the deploy pipeline.
#
# Every value it writes is PUBLISHABLE by design — they are baked into a
# world-readable browser bundle. Nothing secret goes through here, which is
# why they live in repo *variables* rather than secrets.
on:
  workflow_dispatch: {}

jobs:
  configure:
    runs-on: ubuntu-latest
    if: github.repository == 'Gilbert09/talyn'
    env:
      TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT: ${{ secrets.VERCEL_PROJECT_ID_APP }}
    steps:
      - name: Check prerequisites
        run: |
          for v in TOKEN TEAM PROJECT; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; exit 1; fi
          done

      - name: Set Root Directory to apps/web
        # apps/web must be the Root Directory so Vercel reads
        # apps/web/vercel.json. Its build/install commands then `cd ../..` to
        # reach the workspace root. A root-level vercel.json is NOT an option:
        # both deploy workflows run the CLI from the repo root, so marketing
        # would read it too (it did, and broke).
        run: |
          code=$(curl -sS -o /tmp/root.json -w '%{http_code}' \
            -X PATCH "https://api.vercel.com/v9/projects/${PROJECT}?teamId=${TEAM}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"rootDirectory":"apps/web","framework":null}')
          echo "HTTP $code"
          jq -r '{rootDirectory, framework, name}' /tmp/root.json 2>/dev/null || cat /tmp/root.json
          [ "$code" = "200" ] || exit 1

      - name: Set build-time environment variables
        env:
          API_URL: https://prod.talyn.dev
          SUPABASE_URL: ${{ vars.TALYN_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.TALYN_SUPABASE_ANON_KEY }}
          POSTHOG_KEY: ${{ vars.TALYN_POSTHOG_KEY }}
        run: |
          set -u
          fail=0
          put() {
            local key="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::warning::$key has no value — skipping"
              return
            fi
            local body
            body=$(jq -nc --arg k "$key" --arg v "$value" \
              '{key:$k, value:$v, type:"plain",
                target:["production","preview","development"]}')
            local code
            code=$(curl -sS -o /tmp/env.json -w '%{http_code}' \
              -X POST "https://api.vercel.com/v10/projects/${PROJECT}/env?upsert=true&teamId=${TEAM}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$body")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "  $key -> ok"
            else
              echo "::error::$key failed (HTTP $code): $(cat /tmp/env.json)"
              fail=1
            fi
          }
          put VITE_TALYN_API_URL            "$API_URL"
          put VITE_TALYN_SUPABASE_URL       "$SUPABASE_URL"
          put VITE_TALYN_SUPABASE_ANON_KEY  "$SUPABASE_ANON_KEY"
          put VITE_TALYN_POSTHOG_KEY        "$POSTHOG_KEY"
          exit $fail

      - name: Show resulting config
        # Keys only — values are echoed by name so a typo is visible without
        # dumping anything into the log.
        run: |
          curl -sS "https://api.vercel.com/v9/projects/${PROJECT}?teamId=${TEAM}" \
            -H "Authorization: Bearer ${TOKEN}" \
            | jq -r '"rootDirectory=\(.rootDirectory)  framework=\(.framework)"'
          curl -sS "https://api.vercel.com/v9/projects/${PROJECT}/env?teamId=${TEAM}" \
            -H "Authorization: Bearer ${TOKEN}" \
            | jq -r '.envs[] | "  \(.key) [\(.target|join(","))]"' | sort
